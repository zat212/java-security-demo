name: Deploy Spring Boot Application to AWS EC2

on:
  push:
    branches:
      - main # သင့် default branch နာမည် (main သို့မဟုတ် master) ဖြစ်ရပါမည်

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Code များကို Runner ထဲ Checkout ဆွဲယူခြင်း
      - name: Checkout Code
        uses: actions/checkout@v4

      # Step 2: Java 21 Setup လုပ်ခြင်း
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      # Step 3: EC2 သို့ SSH ဝင်ပြီး Deployment ပြုလုပ်ခြင်း
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # 1. ရောက်ရှိနေသော Java Application Process ကို ရပ်တန့်ခြင်း
            pkill -f 'java -jar' || true
            
            # 2. Project Folder ထဲ သွားပြီး Code အသစ် Pull ဆွဲခြင်း
            cd ~/java-security-demo
            git pull origin main
            
            # 3. Project ကို Clean Build ပြုလုပ်ခြင်း
            ./mvnw clean package -DskipTests
            
            # 4. Environment Variables များနှင့်အတူ App ကို Background တွင် ပြန် Run ခြင်း
            DB_URL="${{ secrets.DB_URL }}" \
            DB_USERNAME="${{ secrets.DB_USERNAME }}" \
            DB_PASSWORD="${{ secrets.DB_PASSWORD }}" \
            MAIL_USERNAME="${{ secrets.MAIL_USERNAME }}" \
            MAIL_PASSWORD="${{ secrets.MAIL_PASSWORD }}" \
            JWT_SECRET="${{ secrets.JWT_SECRET }}" \
            GOOGLE_CLIENT_ID="${{ secrets.GOOGLE_CLIENT_ID }}" \
            nohup java -jar target/*.jar > app.log 2>&1 & disown